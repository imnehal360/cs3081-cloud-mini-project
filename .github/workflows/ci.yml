name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruff
        run: python3 -m pip install "ruff==0.9.10"

      - name: Lint Python files
        run: |
          ruff check \
            service/main.py \
            service/model_runner.py \
            service/model_downloader.py \
            training/predict.py \
            tests/test_service.py \
            --select E4,E7,E9,F

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            torch==2.5.1 \
            --index-url \
            https://download.pytorch.org/whl/cpu

          python -m pip install \
            -r service/requirements.txt \
            pytest==8.3.4 \
            httpx==0.28.1

      - name: Run unit tests
        run: python -m pytest tests/ -v

  model-evaluation:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install \
            torch==2.5.1 \
            --index-url \
            https://download.pytorch.org/whl/cpu

          python -m pip install \
            transformers==4.57.6 \
            tokenizers==0.22.2 \
            safetensors==0.7.0

      - name: Download trained model from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/models

          gh release download model-v1 \
            --pattern "pythia-v1.zip" \
            --pattern "pythia-v1.zip.sha256" \
            --dir /tmp/models

          cd /tmp/models

          shasum -a 256 -c pythia-v1.zip.sha256

          unzip -q pythia-v1.zip

          test -f v1/config.json

      - name: Evaluate trained model
        run: |
          mkdir -p results

          python training/predict.py \
            --model /tmp/models/v1 \
            --input data/validation.jsonl \
            --output results/ci_predictions.jsonl

      - name: Quality gate - 95 percent JSON validity
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --out results/ci_score.json \
            --min-validity 95

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-model-evaluation
          path: |
            results/ci_predictions.jsonl
            results/ci_score.json
          if-no-files-found: warn

  secret-scan:
    needs: model-evaluation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
